<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget: a phone's keyboard takes its height from the page, so the terminal ends above it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16181d">
  <title>Callie</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="#/" data-testid="home-link"><img src="/static/icon.svg" alt="" width="22" height="22">Callie</a>
    <span class="crumb" id="crumb" data-testid="crumb"></span>
    <span class="spacer"></span>
    <span class="engine" id="engine-name"></span>
    <button class="quiet" id="card-delete" data-testid="card-delete" hidden>Delete card</button>
  </header>

  <main id="home" data-testid="home" hidden>
    <section class="card" id="new-game" data-testid="new-game">
      <h2>New game</h2>
      <div class="field">
        <label>You play</label>
        <div class="seg" id="f-color" data-testid="new-color">
          <button data-v="w">White</button><button data-v="b">Black</button><button data-v="random">Random</button>
        </div>
      </div>
      <div class="field">
        <label>Opponent</label>
        <div class="seg" id="f-engine" data-testid="new-engine"></div>
        <div class="hint" id="f-engine-hint"></div>
      </div>
      <div class="field">
        <label for="f-elo">Opponent strength</label>
        <div class="elo">
          <input type="range" id="f-elo" data-testid="new-elo" step="10">
          <input type="number" id="f-elo-n" data-testid="new-elo-number" step="10" inputmode="numeric">
          <span class="unit">Elo</span>
          <label class="check" id="f-full-label"><input type="checkbox" id="f-full" data-testid="new-full"> full strength</label>
        </div>
      </div>
      <div class="field">
        <label for="f-opening">Opponent's opening</label>
        <select id="f-opening" data-testid="new-opening"></select>
      </div>
      <div class="field">
        <label id="f-time-label">Your clock</label>
        <div class="seg" id="f-time" data-testid="new-time"></div>
      </div>
      <div class="row">
        <button class="primary" id="f-start" data-testid="new-start">Start game</button>
        <span class="err" id="f-err" data-testid="new-error"></span>
      </div>
    </section>
    <section class="decks" id="freeplay-open" data-testid="freeplay-open">
      <button id="free-open" data-testid="free-open">Freeplay</button>
    </section>
    <section id="review-decks" data-testid="review-decks">
      <h2>Review</h2>
      <div class="decks" id="decks" data-testid="decks"></div>
    </section>
    <section id="recent">
      <div class="recent-head"><h2>Recent games</h2><span id="rating" data-testid="rating" hidden></span></div>
      <ol id="game-list" data-testid="game-list"></ol>
      <div class="empty" id="game-empty" hidden>No games yet.</div>
    </section>
  </main>

  <main id="game" data-testid="game" hidden>
    <section id="board-pane" data-testid="board-pane">
      <div class="player" id="p-top" data-testid="player-opponent"></div>
      <div class="board-row">
        <div id="evalbar" class="evalbar" data-testid="evalbar" title="The engine's evaluation of the position shown"><div class="evalbar-white"></div><span class="evalbar-text"></span></div>
        <div id="board" class="board" data-testid="board"></div>
      </div>
      <div class="player" id="p-bottom" data-testid="player-you"></div>
      <div class="nav" id="nav" data-testid="nav">
        <button id="nav-first" data-testid="nav-first" title="Start (Home)">⏮</button>
        <button id="nav-prev" data-testid="nav-prev" title="Back (←)">◀</button>
        <button id="nav-next" data-testid="nav-next" title="Forward (→)">▶</button>
        <button id="nav-last" data-testid="nav-last" title="Latest (End)">⏭</button>
        <span class="spacer"></span>
        <button id="act-flip" class="quiet" data-testid="flip" title="Turn the board around">Flip</button>
      </div>
      <div id="insight" data-testid="insight"></div>
    </section>

    <section id="moves-pane" data-testid="moves-pane">
      <div id="result" data-testid="result" hidden></div>
      <svg id="graph" data-testid="graph" viewBox="0 0 100 40" preserveAspectRatio="none"><title>White's winning chances over the game</title></svg>
      <div class="moves-head"><span>Moves</span><span class="acpl" id="acpl" data-testid="acpl" title="Average centipawn loss"></span></div>
      <div id="moves" data-testid="moves"></div>
      <div class="actions">
        <button id="act-takeback" data-testid="takeback" title="Undo your last move and the reply to it">Take back</button>
        <button id="act-resign" data-testid="resign">Resign</button>
        <button id="act-pgn" class="quiet" data-testid="copy-pgn">Copy PGN</button>
        <button id="act-free" class="quiet" data-testid="game-free">Freeplay</button>
        <span class="err" id="game-err" data-testid="game-error"></span>
      </div>
    </section>

    <section id="claude-pane" data-testid="claude-pane">
      <div id="lines" data-testid="lines" hidden>
        <div class="lines-head">
          <span id="lines-title" data-testid="lines-title"></span>
          <span id="lines-pager">
            <button id="lines-older" class="quiet" data-testid="lines-older" title="Shown before">‹</button>
            <span id="lines-n" data-testid="lines-n"></span>
            <button id="lines-newer" class="quiet" data-testid="lines-newer" title="Shown after">›</button>
          </span>
        </div>
        <div id="lines-list" data-testid="lines-list"></div>
        <div id="line-nav" data-testid="line-nav">
          <button id="line-first" data-testid="line-first" title="Start of the line (Home)">⏮</button>
          <button id="line-prev" data-testid="line-prev" title="Back (←)">◀</button>
          <button id="line-next" data-testid="line-next" title="Forward (→)">▶</button>
          <button id="line-last" data-testid="line-last" title="End of the line (End)">⏭</button>
          <span id="line-at" data-testid="line-at"></span>
          <button id="line-close" class="quiet" data-testid="line-close" hidden>✕</button>
        </div>
      </div>
      <div id="terminal" data-testid="terminal" hidden></div>
      <div id="keys" data-testid="keys" hidden>
        <button data-key="esc">esc</button><button data-key="up">↑</button><button data-key="down">↓</button>
        <button data-key="enter">⏎</button><button data-key="tab">tab</button><button data-key="ctrlc">^C</button>
      </div>
      <div class="err" id="claude-err" data-testid="claude-error"></div>
      <div id="compose" data-testid="compose">
        <textarea id="compose-text" data-testid="compose-text" rows="2" placeholder="Ask Claude about the game…"></textarea>
        <button id="compose-send" data-testid="compose-send">Send</button>
      </div>
    </section>
  </main>

  <div id="why" data-testid="why" hidden></div>

  <main id="review" data-testid="review" hidden>
    <section id="card-pane" data-testid="card-pane" hidden>
      <div id="card-board" class="board" data-testid="card-board"></div>
      <div id="card-side">
        <div id="card-result" data-testid="card-result" hidden><b id="card-mine" data-testid="card-mine"></b><span id="card-played" data-testid="card-played"></span></div>
        <div id="card-tries" data-testid="card-tries" hidden></div>
        <div class="row" id="card-grade" hidden>
          <button id="card-hard" data-testid="card-hard" hidden>Hard<small></small></button>
          <button id="card-good" data-testid="card-good" hidden>Good<small></small></button>
          <button id="card-easy" data-testid="card-easy" hidden>Easy<small></small></button>
          <button class="primary" id="card-next" data-testid="card-next" hidden>Next</button>
          <button class="quiet" id="card-free" data-testid="card-free">Freeplay</button>
        </div>
        <div id="card-heuristic" data-testid="card-heuristic" hidden></div>
        <div id="card-why" data-testid="card-why" hidden></div>
      </div>
    </section>
    <section id="card-done" data-testid="card-done" hidden>Congratulations, you're all caught up. <a href="#/">Home</a><div id="card-wait" data-testid="card-wait"></div></section>
    <div class="err" id="card-err" data-testid="card-error"></div>
  </main>

  <main id="free" data-testid="free" hidden>
    <section id="free-pane" data-testid="free-pane">
      <div class="board-row">
        <div id="free-evalbar" class="evalbar" data-testid="free-evalbar"><div class="evalbar-white"></div><span class="evalbar-text"></span></div>
        <div id="free-board" class="board" data-testid="free-board"></div>
      </div>
      <div class="nav" id="free-nav" data-testid="free-nav">
        <button id="free-first" data-testid="free-first" title="Start (Home)">⏮</button>
        <button id="free-prev" data-testid="free-prev" title="Back (←)">◀</button>
        <button id="free-next" data-testid="free-next" title="Forward (→)">▶</button>
        <button id="free-last" data-testid="free-last" title="Latest (End)">⏭</button>
        <span class="spacer"></span>
        <button id="free-flip" class="quiet" data-testid="free-flip" title="Turn the board around">Flip</button>
      </div>
      <div id="free-line" data-testid="free-line"></div>
      <div id="free-moves" data-testid="free-moves"></div>
      <div class="err" id="free-err" data-testid="free-error"></div>
    </section>
  </main>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/vendor/addon-unicode-graphemes.js"></script>
  <script src="/static/vendor/addon-webgl.js"></script>
  <script src="/static/pieces.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
